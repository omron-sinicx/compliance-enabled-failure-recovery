teaser: teaser.pdf
overview: |
  We present a method for robust and resilient object insertion under real-world uncertainty, combining a passively compliant soft wrist with automated failure recovery guided by a vision-language model.
  Object insertion remains challenging due to pose uncertainty and environmental variation. Our approach structures insertion as a sequence of contact formations that progressively constrain degrees of freedom, leveraging wrist compliance to absorb contact forces safely, without force sensing or high-frequency control.
  When a skill execution fails, a pre-trained VLM analyzes terminal poses and images, identifies the failure mode, and selects a recovery action. The compliant wrist permits safe, repeated recovery attempts, enabling the system to recover autonomously from grasp misalignments, hole-pose errors, friction increases, and unseen peg geometries.

